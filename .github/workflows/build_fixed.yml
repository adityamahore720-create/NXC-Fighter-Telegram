name: Build Telegram 12.10.6

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;27.2.12479018"             "cmake;3.22.1"

      - name: Clone Telegram 12.10.6
        run: |
          git clone --recursive https://github.com/DrKLO/Telegram.git telegram
          cd telegram
          git checkout f2908b1
          git submodule update --init --recursive

      - name: Build
        working-directory: telegram
        run: |
          chmod +x gradlew
          ./gradlew tasks --no-daemon
          ./gradlew assembleAfatRelease --stacktrace --no-daemon

      - name: Find APK
        run: |
          find telegram -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-12.10.6-APK
          path: |
            telegram/**/*.apk
          if-no-files-found: error
          retention-days: 7
